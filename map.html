<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Local Explorer Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([11.0168, 76.9558], 12); // Coimbatore

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        var markers = [];

        function addMarker(lat, lng, label) {
            var marker = L.marker([lat, lng]).addTo(map).bindPopup(label);
            markers.push(marker);
        }

        function clearMarkers() {
            markers.forEach(function (m) { map.removeLayer(m); });
            markers = [];
        }

        // Zooms/pans so every current marker is visible at once.
        // NOTE: function name must match what MapScreen.java calls (fitAllMarkers).
        function fitAllMarkers() {
            if (markers.length === 0) return;
            var group = L.featureGroup(markers);
            map.fitBounds(group.getBounds().pad(0.2));
        }

        // ---- Fixes for the WebView "map only renders top-left corner" bug ----
        // Leaflet measures its container's size the moment it initializes.
        // Inside a JavaFX WebView, that container isn't fully laid out yet
        // at that exact moment, so the map snapshots a too-small size and
        // never fills the panel. Re-measuring after layout settles, and again
        // on every resize, fixes it - this replaces any need for a Thread.sleep
        // on the Java side.
        function refreshMapSize() {
            map.invalidateSize();
        }
        setTimeout(refreshMapSize, 200);
        setTimeout(refreshMapSize, 600);
        window.addEventListener('resize', refreshMapSize);
        if (window.ResizeObserver) {
            new ResizeObserver(refreshMapSize).observe(document.getElementById('map'));
        }
    </script>
</body>
</html>
